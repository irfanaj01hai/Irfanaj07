function unlock(id, code){
  var a = APPS.find(function(x){return x.id===id;});
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(code.trim().toUpperCase())).then(function(h){
    var hex = Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    if(a.codes.indexOf(hex)>-1){
      try{var u=JSON.parse(localStorage.getItem('used_'+id)||'[]');u.push(hex);localStorage.setItem('used_'+id,JSON.stringify(u));}catch(e){}
      dlup(id); location.href=a.apk;
    } else {
      document.getElementById('cerr').innerHTML='<div class="coderr">❌ Galat code! Admin se sahi UNLOCK CODE lo.</div>';
    }
  });
  return false;
}
